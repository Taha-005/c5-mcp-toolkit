[project]
name = "c5-mcp-toolkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taha-005", email = "tmf15@mail.aub.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.4",
    "httpx>=0.28.1",
    "openai-agents>=0.24.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
c5-mcp-toolkit = "c5_mcp_toolkit:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
